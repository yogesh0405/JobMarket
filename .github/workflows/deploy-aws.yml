name: Production AWS Deployment Pipeline

on:
  push:
    branches:
      - main
      - production
    paths:
      - 'backend/**'
      - 'App/**'
      - '.github/workflows/deploy-aws.yml'

jobs:
  test-and-audit:
    name: Security & Compilation Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Backend Tests & Type Check
        run: |
          cd backend
          npm ci
          npx tsc --noEmit
          npx tsx src/tests/securityRegression.ts
          npx tsx src/tests/secretsAudit.test.ts

      - name: Frontend Build Verification
        run: |
          cd App
          npm ci
          npx tsc --noEmit
          npm run build

  deploy-backend-aws:
    name: Deploy Backend to Amazon ECR & ECS
    needs: test-and-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: jobmarket-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger ECS Rolling Deployment
        run: |
          aws ecs update-service --cluster enchanted-wolf-jz9o51jobmarket-cluster --service jobmarket-backend-service --force-new-deployment --region us-east-2

  deploy-frontend-aws:
    name: Deploy Web App to Amazon S3 & CloudFront
    needs: test-and-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Application
        env:
          VITE_API_URL: ""
        run: |
          cd App
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Sync to S3 Bucket
        run: |
          cd App
          aws s3 sync dist/ s3://jobmarket-web-assets-prod --delete --cache-control "max-age=31536000, public"
          aws s3 cp dist/index.html s3://jobmarket-web-assets-prod/index.html --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront CDN Cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
          fi
